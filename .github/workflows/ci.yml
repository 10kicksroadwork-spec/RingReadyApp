name: CI

on:
  push:
    branches:
      - main
      - 'coach-review-*'
      - 'cursor/**'
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Unit tests
        run: npm test

      - name: Manual HR smoke
        run: node scripts/manual-rest-hr-smoke.mjs

      - name: Modality smoke
        run: node scripts/modality-performance-smoke.mjs

      - name: Production build
        run: npm run build

      - name: Verify service worker build id injection
        run: node scripts/verify-sw-build-id.mjs

  browser-e2e:
    name: browser-e2e
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Browser E2E
        env:
          VITE_SUPABASE_URL: ''
          VITE_SUPABASE_ANON_KEY: ''
        run: npm run test:e2e

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  production-contract:
    name: production-contract
    needs: quality
    runs-on: ubuntu-latest
    environment: production-contract

    # Production deploy gate only — intentionally skipped on PR branches.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main'

    env:
      RING_READY_SUPABASE_URL: ${{ secrets.RING_READY_SUPABASE_URL }}
      RING_READY_SUPABASE_ANON_KEY: ${{ secrets.RING_READY_SUPABASE_ANON_KEY }}
      RING_READY_TEST_EMAIL: ${{ secrets.RING_READY_TEST_EMAIL }}
      RING_READY_TEST_PASSWORD: ${{ secrets.RING_READY_TEST_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Verify live Supabase contract
        env:
          RING_READY_REQUIRE_PROOF_TESTS: '1'
        run: npm run test:proof-auth
